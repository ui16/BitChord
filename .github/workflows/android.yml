name: Android Release APK

on:
  push:
    branches: [main, vinyl-edition]
  workflow_dispatch:

jobs:
  build-prod-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Setup Secrets (Keystore & local.properties)
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
            {
              echo "storeFile=bitchord-release.jks"
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } > keystore.properties
          fi
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Prod Release
        run: ./gradlew assembleProdRelease
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-prod-release
          path: app/build/outputs/apk/prod/release/*.apk
      - name: Upload Wear OS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-wear-prod-release
          path: wearos/build/outputs/apk/prod/release/*.apk

  build-vinyl-release:
    if: github.ref == 'refs/heads/vinyl-edition' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Prepare local properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Vinyl Edition release APK
        run: ./gradlew assembleVinylRelease
      - name: Upload Vinyl Edition APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Vinyl-Edition-unsigned
          path: app/build/outputs/apk/vinyl/release/*.apk
