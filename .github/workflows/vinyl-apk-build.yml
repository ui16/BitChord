name: Vinyl APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vinyl-edition
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleVinylRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-Vinyl-Edition
          path: app/build/outputs/apk/vinyl/release/*.apk
          if-no-files-found: error
